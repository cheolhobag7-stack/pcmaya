integrated_modules:
  lot_traceability:
    required_fields: ["LOT","품번","생산일","공정","설비","작업자","검사이력","출하이력"]
    retention: "3년"
    target_trace_time: "1시간"
  safety_risk:
    required_fields: ["위험요인","현재조치","위험성","개선조치","담당자","완료예정일"]
  equipment_trial:
    required_fields: ["설비명","트라이일","조건","결과","이상유무","조치내용","판정"]
  training:
    required_fields: ["교육명","교육일","대상자","교육내용","교육자","참석확인"]
  production:
    required_fields: ["품번","계획수량","실적수량","불량수량","생산일"]
  inventory:
    required_fields: ["품번","입고","출고","현재고"]
  quality:
    required_fields: ["고객사","품번","불량수량","PPM","원인","조치","담당자","완료일"]

management_reports:
  weekly:
    sections:
      - "QMS 변경/오류"
      - "LOT 추적성"
      - "안전/위험성평가"
      - "설비"
      - "교육"
      - "생산"
      - "재고"
      - "품질"
      - "미결 조치사항"
  monthly:
    sections:
      - "목표 PPM 대비 실적"
      - "고객사별 PPM"
      - "차종/품번별 주요 불량"
      - "전월 대비 증감"
      - "개선과제 진행률"
      - "담당자/완료일"
      - "결정 필요사항"

audit_packages:
  internal: true
  customer: true
  certification: true

customer_response:
  enabled: true
  default_customer: "한온시스템"
  include:
    - "문제현상"
    - "LOT 추적 결과"
    - "원인"
    - "임시조치"
    - "영구대책"
    - "재발방지"
    - "증빙자료"

# 로컬 폴더 → 11_INPUT 복사(inputsync) 분류 키워드: 파일명 또는 상위 폴더명에 포함되면 해당 모듈로 분류.
# 두 모듈 이상에 걸리거나 하나도 안 맞으면 복사하지 않고 목록으로 알려준다.
input_sync:
  extensions: [".xlsx", ".xlsm", ".xls", ".csv", ".docx", ".pdf"]
  max_file_mb: 50
  keywords:
    lot: ["LOT", "로트", "추적"]
    safety: ["안전", "위험성", "위험"]
    equipment: ["설비", "트라이얼", "시운전", "점검"]
    training: ["교육"]
    production: ["생산", "작업일보"]
    inventory: ["재고", "입고", "출고", "수불"]
    quality: ["품질", "PPM", "불량", "클레임"]

# 로컬 드라이브 정리(organizeplan) 목표 폴더 구조: 폴더 이름에 inputsync 키워드(LOT·안전·설비·교육·생산·재고·품질)가 들어 있어 이후 inputsync 가 그대로 분류한다.
drive_layout:
  qms: "00_QMS문서"
  lot: "01_LOT추적"
  safety: "02_안전"
  equipment: "03_설비"
  training: "04_교육"
  production: "05_생산"
  inventory: "06_재고"
  quality: "07_품질"
  sq: "08_SQ심사"
  customer: "09_고객대응(한온시스템)"
  unsorted: "99_미분류_확인필요"
  qms_keywords: ["QMS", "절차서", "작업표준", "매뉴얼", "문서관리대장"]   # 또는 파일명이 SH- / SH_ 로 시작
  sq_keywords: ["SQ"]
  customer_keywords: ["한온", "HANON"]
  skip_names: ["thumbs.db", "desktop.ini", ".ds_store"]
  max_file_mb: 200
