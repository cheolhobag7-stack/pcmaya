integrated_modules:
  lot_traceability:
    required_fields: ["LOT","품번","생산일","공정","설비","작업자","검사이력","출하이력"]
    retention: "3년"
    target_trace_time: "1시간"
  safety_risk:
    required_fields: ["위험요인","현재조치","위험성","개선조치","담당자","완료예정일"]
  equipment_trial:
    required_fields: ["설비명","트라이일","조건","결과","이상유무","조치내용","판정"]
  training:
    required_fields: ["교육명","교육일","대상자","교육내용","교육자","참석확인"]
  production:
    required_fields: ["품번","계획수량","실적수량","불량수량","생산일"]
    # 2026-10-06 사용자 확인: 엑셀 앞 10행의 열 제목이 아래와 '정확히 같을 때만' 필수 항목을 충족한 것으로 본다(공백 무시)
    field_aliases:
      "품번": ["품명", "제품명", "부품명"]
      "계획수량": ["계획", "일생산계획", "생산계획"]
      "실적수량": ["실적", "일생산실적", "생산실적"]
      "불량수량": ["불량", "불량수"]   # 2026-10-06 사용자 확인: 불량율·불량내용·'파이프 높이 불량' 등 불량 종류는 인정하지 않음
      "생산일": ["일자", 're:(\d+월)?\d+주차', 're:\d{1,2}일', 're:\d{1,2}/\d{1,2}생산계획대실적']   # 2026-10-06 사용자 확인: '일자', 'N주차'(1주차, 1월 1주차), 'N일'(1일~31일), 'M/D 생산계획대실적'(일별 시트 제목) 열. 제작일자·점검일자·출하 일자 등은 인정하지 않음
    # 2026-10-06 사용자 확인: 파일명에 '계획'·'주차'가 있으면(생산계획·주간 생산계획·N주차 등) 불량수량을 필수에서 제외. 실적 파일은 불량수량 필수 유지
    field_exemptions:
      - name_contains: ["계획", "주차"]
        exempt: ["불량수량"]
  inventory:
    required_fields: ["품번","입고","출고","현재고"]
  quality:
    required_fields: ["고객사","품번","불량수량","PPM","원인","조치","담당자","완료일"]

management_reports:
  weekly:
    sections:
      - "QMS 변경/오류"
      - "LOT 추적성"
      - "안전/위험성평가"
      - "설비"
      - "교육"
      - "생산"
      - "재고"
      - "품질"
      - "미결 조치사항"
  monthly:
    sections:
      - "목표 PPM 대비 실적"
      - "고객사별 PPM"
      - "차종/품번별 주요 불량"
      - "전월 대비 증감"
      - "개선과제 진행률"
      - "담당자/완료일"
      - "결정 필요사항"

audit_packages:
  internal: true
  customer: true
  certification: true

customer_response:
  enabled: true
  default_customer: "한온시스템"
  include:
    - "문제현상"
    - "LOT 추적 결과"
    - "원인"
    - "임시조치"
    - "영구대책"
    - "재발방지"
    - "증빙자료"

# 로컬 폴더 → 11_INPUT 복사(inputsync) 분류 키워드: 파일명 또는 상위 폴더명에 포함되면 해당 모듈로 분류.
# 두 모듈 이상에 걸리거나 하나도 안 맞으면 복사하지 않고 목록으로 알려준다.
input_sync:
  extensions: [".xlsx", ".xlsm", ".xls", ".csv", ".docx", ".pdf"]
  max_file_mb: 50
  keywords:
    lot: ["LOT", "로트", "추적", "모의추적"]
    safety: ["안전", "위험성", "위험", "보건", "소방", "보호구", "MSDS", "TBM"]
    equipment: ["설비", "트라이얼", "시운전", "보전", "금형", "지그", "용접기", "로봇"]
    training: ["교육", "훈련", "역량", "OJT"]
    production: ["생산", "작업일보", "작업지시", "생산계획", "납품", "가동", "출하", "수출"]
    inventory: ["재고", "입고", "출고", "수불", "자재", "원자재", "창고", "선입선출", "실사"]
    quality: ["품질", "PPM", "불량", "클레임", "검사", "시정조치", "8D", "부적합", "SPC", "MSA", "관리계획서", "FMEA", "ISIR", "성적서", "크래임", "협정서", "계측기", "교정", "GAUGE"]

# 로컬 드라이브 정리(organizeplan) 목표 폴더 구조: 폴더 이름에 inputsync 키워드(LOT·안전·설비·교육·생산·재고·품질)가 들어 있어 이후 inputsync 가 그대로 분류한다.
drive_layout:
  qms: "00_QMS문서"
  lot: "01_LOT추적"
  safety: "02_안전"
  equipment: "03_설비"
  training: "04_교육"
  production: "05_생산"
  inventory: "06_재고"
  quality: "07_품질"
  sq: "08_SQ심사"
  customer: "09_고객대응(한온시스템)"
  unsorted: "99_미분류_확인필요"
  # 2026-10-06 사용자 확인: 출하·수출→생산, 관리계획서·FMEA·ISIR·성적서·크래임·협정서·계측기·교정·GAUGE→품질, IATF16949 시스템 폴더·절차서/매뉴얼/프로세스 파일명→QMS문서
  qms_keywords: ["QMS", "문서관리대장"]   # 파일명·폴더 어디든 / 또는 파일명이 SH- / SH_ 로 시작
  qms_name_keywords: ["절차서", "작업표준", "매뉴얼", "프로세스", "SHINHWA_QM", "SHINHWA_QP", "SHINHWA_WI", "SHINHWA_FM"]   # 파일명에만 적용(폴더 이름만으로 QMS 로 보내지 않음)
  qms_folder_keywords: ["IATF16949 시스템"]   # 폴더에만 적용
  sq_keywords: ["SQ"]
  customer_keywords: ["한온", "HANON"]
  # 2026-10-06 사용자 확인: 다른 규칙으로 분류되지 않은(미분류) 파일에만 적용하는 폴더 이름 → 분류
  name_overrides:        # 파일명에 들어 있으면(미분류일 때만, 폴더 지정보다 우선) — 2026-10-06 사용자 확인
    "전체계획": production
    "전체 계획": production
    "forecast": production
  folder_overrides:
    "자격인증": training
    "CLAIM": quality
    "이상발생보고서": quality
    "특별특성": quality
    "조도측정": safety
    "작업표준서": qms
    "협력사 평가": quality
    "공급능력 관리": quality
    "인증서": sq
  skip_names: ["thumbs.db", "desktop.ini", ".ds_store"]
  max_file_mb: 200

# 기록 종류 있음/없음 현황용(파일명 키워드로만 판단, 내용은 판정하지 않음). 2026-10-06 사용자 선택 '둘 다 진행'에 따라 제안한 키워드이며 담당자가 확인·수정한다.
record_types:
  lot: {"LOT 추적/이력": ["LOT", "로트", "추적"]}
  safety: {"위험성평가": ["위험성평가", "위험성 평가", "위험요인"], "소화기·소방·비상대피": ["소화기", "소방", "비상대피"], "MSDS·화학물질": ["MSDS", "GHS"], "조도측정": ["조도"], "안전보건 규정·방침": ["안전보건", "안전관리"], "비상계획·우발사고": ["비상계획", "우발사고", "비상대응"], "안전·환경 교육": ["안전교육", "환경교육", "ESG교육"]}
  equipment: {"설비 일상점검표": ["일상점검"], "금형관리대장·점검": ["금형"], "설비 고장·수리일지": ["고장", "수리일지"], "설비관리대장": ["설비관리대장"], "설비 CAPA·종합효율": ["CAPA", "종합효율", "케파"], "MTTR·MTBF": ["MTTR", "MTBF"], "정기점검·예방보전": ["정기점검", "예방보전"], "시운전·트라이": ["트라이", "시운전", "TRY"]}
  training: {"자격인증·평가": ["자격인증", "자격부여", "자격 인증"], "내부심사원": ["심사원"], "숙련도·다기능": ["숙련", "다기능"], "교육 실시 기록": ["교육일지", "교육실시", "교육결과", "교육 실시"], "교육 계획": ["교육계획", "교육 계획"], "교육 교안·자료": ["교안", "교육자료"]}
  production: {"생산계획": ["생산 계획", "생산계획", "전체계획", "전체 계획", "주간"], "생산실적": ["생산실적", "생산 실적"], "출하관리": ["출하"], "매출·납품 현황": ["매출", "납품"], "수요예측·단산": ["forecast", "단산", "FCST"], "설비 CAPA·케파 분석": ["케파", "CAPA"]}
  inventory: {"자재관리": ["자재관리"], "재고관리·재고조사": ["재고관리", "재고조사", "재고실사", "재고"], "불용자재": ["불용"], "창고 LAYOUT": ["LAYOUT", "창고"], "출하지시서": ["출하지시"]}
  quality: {"고객 클레임·이상발생": ["클레임", "크래임", "CLAIM", "이상발생"], "수입검사": ["수입검사"], "검사기준서·협정서": ["검사기준서", "검사협정서", "협정서"], "검사성적서": ["성적서"], "관리계획서": ["관리계획서"], "FMEA": ["FMEA"], "공정능력·특별특성": ["공정능력", "특별특성"], "게이지 R&R·MSA": ["게이지", "R&R", "MSA"], "계측기 관리": ["계측기"], "협력사 평가·공정감사": ["협력", "공정감사"], "내부감사·심사": ["내부감사", "시스템심사", "제품심사", "공정심사"], "초도품·ISIR": ["초도품", "ISIR"], "PPM·품질실적": ["PPM", "품질실적", "품질관리 납품"]}

