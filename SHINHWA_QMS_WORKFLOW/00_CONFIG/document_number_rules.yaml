# 문서번호 규칙: 접두어 SH- (예: SH-QP-07, SH-WI-07-01, SH-FM-066)
# doc_pattern: 파일명/본문에서 문서번호를 찾는 정규식 (SH- 는 비교 시 자동 제거)
prefix: "SH"
initial_revision: "Rev.00"
doc_pattern: '(?:SH-)?(?:QM|QP|WI|FM)-\d{2,3}(?:-\d{2,3}){0,2}|(?:APQP|PPAP|PFMEA|CP|SPC|MSA)-[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*'
by_type:
  QM: '^SH-QM-\d{2,3}$'
  QP: '^SH-QP-\d{2,3}(-\d{2,3})?$'
  WI: '^SH-WI-\d{2,3}-\d{2,3}(-\d{2,3})?$'
  FM: '^SH-FM-\d{2,3}(-\d{2,3}){0,2}$'
revision_pattern: 'Rev\.?\s?(\d{2})'
