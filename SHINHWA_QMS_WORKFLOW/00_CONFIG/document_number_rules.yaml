# 문서번호 규칙 (회사 규정에 맞게 수정)
# doc_pattern: 파일명/본문에서 문서번호를 찾는 정규식
doc_pattern: '(?:QM|QP|WI|FM)-\d{2}(?:-\d{2}){0,2}|(?:APQP|PPAP|PFMEA|CP|SPC|MSA)-[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*'
by_type:
  QM: '^QM-\d{2}$'
  QP: '^QP-\d{2}(-\d{2})?$'
  WI: '^WI-\d{2}-\d{2}(-\d{2})?$'
  FM: '^FM-\d{2}-\d{2}(-\d{2})?$'
revision_pattern: 'Rev\.?\s?(\d{2})'
