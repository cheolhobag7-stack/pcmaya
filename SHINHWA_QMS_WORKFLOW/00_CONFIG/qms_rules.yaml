# QMS 일반 규칙 (회사 실제 규정에 맞게 수정)
company:
  name: "(주)신화에이치앤티"
  prefix: "SH"
  names: ["(주)신화에이치앤티", "주식회사 신화에이치앤티", "신화에이치앤티"]   # 본문에 하나 이상 있어야 함

base_standard: ["ISO 9001:2015", "IATF 16949:2016"]
main_customer: "한온시스템"
quality_manager: "김흥수"
customer_approver: "이은주"
revision_initial: "Rev.00"
lot_trace_target_time: "1시간"
lot_traceability_retention: "3년"

# 파일명 접두어 → 문서 유형 폴더
classify:
  QM: QM
  QP: QP
  WI: WI
  FM: FM
  APQP: APQP
  PPAP: PPAP
  PFMEA: PFMEA
  CP: CONTROL_PLAN
  SPC: SPC_MSA
  MSA: SPC_MSA
  SH: MASTER_REF      # SH_ 로 시작하는 관리자료(대장/마스터/계획/실행관리)

# 유형별 필수 항목(본문에 포함되어야 하는 키워드)
required_sections:
  QM: [목적, 적용범위, 품질방침]
  QP: [목적, 적용범위, 책임과 권한, 절차]
  WI: [목적, 적용범위, 작업방법]
  FM: []
  APQP: []
  PPAP: []
  PFMEA: []
  CONTROL_PLAN: []
  SPC_MSA: []

# ISO 9001 / IATF 16949 요구사항 체크: 문서 유형별로 본문에 있어야 할 조항 키워드(하나 이상)
standards_check:
  QP:
    - {clause: "ISO9001 7.5 문서화된 정보", any_of: ["문서관리", "기록관리", "문서화된 정보"], applies_to_prefix: "QP-0"}
  QM:
    - {clause: "ISO9001 5.2 품질방침", any_of: ["품질방침"]}
    - {clause: "IATF16949 4.3.2 고객 특정 요구사항", any_of: ["고객 특정 요구사항", "CSR"]}

# 보존기간 (FM/QP/WI 에 '보존기간' 표기 필요, 허용값)
retention:
  required_for: [QP, WI, FM]
  allow_blank_for: [FM]          # 양식(FM) 단계에서는 보존기간 공란/미표기 허용 (허용값 외 구체값을 적으면 오류)
  allowed: ["1년", "3년", "5년", "10년", "영구"]   # LOT 추적성 기록은 5년(2026-10-07 사용자 결정: 모든 문서 보존 5년)

# 결재 상태 검사: 본문에 아래 라벨이 모두 있어야 승인대기로 이동
approval_labels: [작성, 검토, 승인]

# ---- 확장 검토 규칙 (※ 기본값은 가정치 — 회사 규정 확정 후 수정) ----
document_status:
  field: '문서상태'                     # 본문 '문서상태: 승인완료' 형태
  approved_values: ["승인완료", "APPROVED", "ACTIVE"]
  header_marker: '\b(?:ACTIVE|APPROVED)\b|승인완료'   # 양식 머리글(앞 600자)의 승인 표기
date_fields:
  initial: '제정일'                     # Rev.00 문서에 필수
  revised: '개정일'                     # Rev.01 이상 문서에 필수
  optional_before_approval: true        # 승인(ACTIVE 등) 표기 전 양식은 제정일 공란 허용 (FINAL 단계에서는 필수)
page_number_required_for: [QM, QP, WI]
toc_required_for: [QM, QP]
csr_required_for: [QM]                  # 고객 특정 요구사항(CSR) 언급 필수 유형
core_tools:                             # 본문에 언급되면 연계 문서번호 명시 필요
  APQP: ["APQP"]
  PPAP: ["PPAP"]
  PFMEA: ["PFMEA", "P-FMEA"]
  CONTROL_PLAN: ["Control Plan", "관리계획서", "CONTROL PLAN"]
  SPC: ["SPC"]
  MSA: ["MSA"]
core_tool_docs: {}                      # 확정 전: 예) PFMEA: SH-QP-xx  (비워 두면 임의 생성하지 않음)
lot_traceability:
  keyword: "LOT 추적"
  retention_patterns: ["5년", "5 년", "60개월", "60 개월"]
  target_patterns: ["1시간", "1 시간", "60분", "60 분"]
  # 본문에 LOT 추적 언급 시 보존기간(5년)과 목표시간(1시간)을 명시해야 함
obsolete_docs: []                       # 폐기된 문서번호 목록 (06_HISTORY/폐기문서 폴더 파일명도 자동 반영)

# 폐기/참조금지 문서 (범위 표기 가능: FM-030~039). 참조 시 오류 처리, 시스템 어디에 있어도 FINAL 금지.
prohibited_references: ["FM-030~039"]
# 폐기/참조금지 번호 참조를 허용하는 예외 문서 (구형 번호를 대조하는 계획표 등)
prohibited_reference_exceptions: ["SH-FM-122"]
final_release_rules:
  require_document_number_match: true
  require_revision_match: true
  require_approval_complete: true
  block_if_prohibited_reference_found: true

# ---- v0.2 패키지 반영 ----
# 삭제 지시 문구: 본문에 있으면 FAIL
prohibited_phrases:
  - "FM Master 재매핑 반영"
  - "QP 제3권 FM-030~039 폐기/참조금지"
  - "문서통제 주의: 승인된 FM Master와 일치"
  - "부록 E. Rev.00 ACTIVE Release 승인결과(AP-01~04)"
  - "※ 실제 승인자 성명·서명·일자 입력 후 관리본 배포"
# v0.2 설정값(현재 자동 검사에는 미사용 - 용도 확정 후 연결): 반드시 안내되어야 하는 FM 번호
required_notice: ["FM-066", "FM-067", "FM-068", "FM-069", "FM-078", "FM-079", "FM-080", "FM-096", "FM-094"]

# 양식 결재란: 목록 시트의 '결재 방식'(작성·확인 / 작성·검토·승인)을 따른다.
# ACTIVE 표기된 대장/집계표형 양식(예: FM-066~069, 078~080, 094, 096)은 개별 결재란을 요구하지 않는다.
approval_by_header_marker:
  skip_label_check: true

# FINAL 배포 운영 (FINAL 패키지 반영)
final_operation:
  approval_marker: "APPROVED.txt"   # 사람이 sign 을 실행하면 승인 패키지에 생성됨 (자동 생성 금지)
  require_release_gate_pass: true
  archive_previous_revision: true
  create_rollback_backup: true
  create_distribution_list: true
  create_integrity_hash: true
  create_final_report: true
